; Pengaturan PHP untuk aplikasi perpustakaan.
; Bagian "mesin" — dipasang sekali, tidak perlu diubah.

date.timezone = Asia/Jakarta

; Jangan pamerkan versi PHP ke pengunjung
expose_php = Off

; Tampilkan error PHP di halaman? Diatur dari docker-compose.yml (TAMPILKAN_ERROR):
;   docker compose up -d                        -> On  (mode belajar, hanya di laptop)
;   TAMPILKAN_ERROR=Off docker compose up -d    -> Off (WAJIB sebelum tunnel/online)
display_errors = ${TAMPILKAN_ERROR}
log_errors = On

; Mitigasi tambahan PHP2Shell (CVE-2026-109619) dan CVE-2026-115560
session.upload_progress.enabled = 0

; Aplikasi ini tidak menerima upload file
file_uploads = Off
post_max_size = 8M
memory_limit = 128M

; Jangan izinkan PHP membuka/menyertakan file dari internet
allow_url_fopen = Off
allow_url_include = Off

; Cookie login yang aman
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
; Strict = cookie login tidak dikirim dari situs lain (menahan serangan CSRF)
session.cookie_samesite = Strict
