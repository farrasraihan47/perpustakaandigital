# Menjalankan aplikasi:   docker compose up -d --build
# Aplikasi:               http://localhost:8088
# phpMyAdmin:             http://localhost:8081   (hanya untuk di laptop, JANGAN di-upload ke hosting)
# Menghentikan:           docker compose down
# Reset database ke awal: docker compose down -v   lalu   docker compose up -d

services:
  web:
    build: ./docker
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - .:/var/www/html
    environment:
      # On = error PHP tampil (belajar). Off = disembunyikan (WAJIB saat tunnel/online).
      TAMPILKAN_ERROR: ${TAMPILKAN_ERROR:-On}
    depends_on:
      - db
    mem_limit: 512m

  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root_lokal_saja
      MYSQL_DATABASE: perpustakaan
      MYSQL_USER: perpus_app
      MYSQL_PASSWORD: perpus_app_lokal
      TZ: Asia/Jakarta
    volumes:
      # file .sql di folder database/ otomatis dijalankan saat database pertama kali dibuat
      - ./database:/docker-entrypoint-initdb.d:ro
      - data_mysql:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:5.2
    ports:
      - "127.0.0.1:8081:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db

volumes:
  data_mysql:
